<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/syspass

    <Directory /var/www/syspass>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Route everything through index.php except static assets and api.php
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/public/
        RewriteCond %{REQUEST_URI} !^/api\.php
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L,QSA]
    </Directory>

    # Block access to sensitive files and directories
    <DirectoryMatch "/\.(git|svn|hg)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "\.(json|lock|xml|md|yml|yaml|ini|log|sh|sql)$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "^/var/www/syspass/(app|lib|schemas|tests|vendor|build)">
        Require all denied
    </DirectoryMatch>

    # Allow only index.php, api.php and public/ from web
    <Directory /var/www/syspass/public>
        Require all granted
    </Directory>

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
